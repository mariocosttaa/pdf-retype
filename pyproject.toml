[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-retype"
version = "0.1.0"
description = "Identify fonts in a PDF, find a word, and replace it while keeping its look"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["pdf", "fonts", "text-replacement", "redaction", "pymupdf", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Utilities",
]
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdf-retype = "pdf_retype.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pdf_retype"]

[tool.pytest.ini_options]
testpaths = ["tests"]
